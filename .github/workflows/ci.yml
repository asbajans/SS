name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "./api[dev]"
      - name: Lint
        run: ruff check --config api/pyproject.toml api engine
      - name: Tests
        run: python -m pytest -q api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - name: Update Portainer stack
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_URL: https://cont.asb.web.tr
          STACK_ID: 98
          ENDPOINT_ID: 2
        run: |
          set -euo pipefail
          if [ -z "$PORTAINER_API_KEY" ]; then
            echo "PORTAINER_API_KEY tanimli degil - repo secret'ini ekleyin"
            exit 1
          fi
          code=$(curl -sS -o /tmp/pt_resp.txt -w '%{http_code}' -X PUT \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "User-Agent: SSDeploy/1.0" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$PORTAINER_URL/api/stacks/$STACK_ID/git/redeploy?endpointId=$ENDPOINT_ID")
          echo "HTTP $code"
          cat /tmp/pt_resp.txt
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
