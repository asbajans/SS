name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "./api[dev]"
      - name: Lint
        run: ruff check --config api/pyproject.toml api engine
      - name: Tests
        run: python -m pytest -q api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && vars.PORTAINER_WEBHOOK != ''
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer stack update
        env:
          WEBHOOK: ${{ vars.PORTAINER_WEBHOOK }}
        run: |
          url="$WEBHOOK"
          case "$url" in *\?*) url="$url&pullimage=false";; *) url="$url?pullimage=false";; esac
          code=$(curl -sS -o /tmp/pt_resp.txt -w '%{http_code}' -X POST -L --max-time 60 "$url")
          echo "HTTP $code"
          cat /tmp/pt_resp.txt
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
