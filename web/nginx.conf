server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location ^~ /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # --- SEO / crawler endpoints (dynamic, served by the API) ---
  location ~ ^/(sitemap[^/]*\.xml|robots\.txt|llms[^/]*\.txt|feed\.xml|indexnow-key\.txt)$ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "public, max-age=3600";
  }

  # IndexNow key file must live at the domain root: /{key}.txt
  location ~ "^/[A-Za-z0-9_-]{8,64}\.txt$" {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "public, max-age=86400";
  }

  location ^~ /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
