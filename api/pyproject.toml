[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "engine*"]
exclude = ["tests*"]

[project]
name = "crowdscope-api"
version = "0.1.0"
description = "Simulated community research SaaS - API + engine"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.6",
  "email-validator>=2.1",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "pgvector>=0.2.5",
  "pypdf>=4.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
prod = [
  "psycopg[binary]>=3.1",
  "miniopy-async>=1.20",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008", "S105", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires running services"]
